
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>GXDE LIGHT</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

background:
radial-gradient(
circle at top,
#0f2027,
#000
);

font-family:
Arial,
Helvetica,
sans-serif;

color:#00ffe1;

display:flex;

justify-content:center;

align-items:center;

padding:15px;
}

.panel{

width:min(
500px,
100%
);

background:
rgba(0,255,225,.05);

border:
1px solid
rgba(0,255,225,.3);

border-radius:22px;

padding:25px;

box-shadow:
0 0 40px
rgba(0,255,225,.15);
}

h1{

text-align:center;

margin:
0 0 6px;

letter-spacing:4px;
}

.subtitle{

text-align:center;

opacity:.5;

font-size:11px;

letter-spacing:2px;

margin-bottom:25px;
}

.info{

text-align:center;

font-size:13px;

line-height:1.7;

margin-bottom:20px;

opacity:.8;
}

.card{

background:
rgba(0,255,225,.04);

border:
1px solid
rgba(0,255,225,.18);

border-radius:15px;

padding:15px;

margin-bottom:13px;
}

label{

display:block;

font-size:12px;

letter-spacing:1px;

margin-bottom:8px;
}

input,
select{

width:100%;

padding:13px;

border-radius:9px;

border:
1px solid
rgba(0,255,225,.3);

background:#001514;

color:#00ffe1;

font-size:16px;
}

button{

width:100%;

border:0;

border-radius:12px;

padding:15px;

font-weight:bold;

cursor:pointer;

color:#001b18;

background:
linear-gradient(
145deg,
#00ff9c,
#00b968
);

font-size:15px;
}

.network{

margin-top:8px;

font-size:11px;

opacity:.5;

text-align:center;
}

#message{

text-align:center;

margin-top:15px;

font-size:12px;

color:#00ff9c;
}


.passwordRow {
  display: flex;
  align-items: center;
  gap: 0;
  margin-top: 7px;
}

.passwordRow input {
  flex: 1;
  margin-top: 0;
  border-radius: 6px 0 0 6px;
}

.passwordToggle {
  width: 42px;
  height: 50px;
  min-height: 37px;
  margin-top: 0;
  padding: 0;

  border-left: none;
  border-radius: 0 6px 6px 0;

  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.passwordToggle svg {
  width: 20px;
  height: 20px;
}

</style>

</head>

<body>

<div class="panel">

<h1>GXDE LIGHT</h1>

<div class="subtitle">
WIFI CONFIGURATION
</div>

<div class="info">

Connect GXDE LIGHT to your home Wi-Fi.

<br>

The lighting settings stored inside
the controller will remain unchanged.

</div>


<form
action="/wifi/save"
method="POST">


<div class="card">

<label>
WIFI NETWORK
</label>

<select
name="ssid"
id="ssid"
required>

<option value="">
Select Wi-Fi network
</option>

</select>

<div class="network">
Or type the SSID manually below
</div>

<input
type="text"
name="manualssid"
id="manualssid"
placeholder="Wi-Fi SSID"
style="margin-top:10px">

</div>


<div class="card">

<label>
WIFI PASSWORD
</label>
<div class="passwordRow">
<input
type="password"
name="password"
id="password"
placeholder="Wi-Fi password">

     <button type="button" id="passwordButton" class="passwordToggle"
                      aria-label="Toggle password visibility" onclick="togglePassword()">
                      <!-- SVG Eye Icon (Visible by Default) -->
                      <svg id="eyeIcon" viewBox="0 0 24 24">
                        <path
                          d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.01-.16c0-1.66-1.34-3-3-3l-.16.01z" />
                      </svg>
                    </button>
</div>
</div>


<button
type="submit">

SAVE WIFI & RESTART

</button>


</form>


<div id="message"></div>

</div>


<script>

   /* ========================================================
             PASSWORD SHOW / HIDE
          ======================================================== */
          const eyeOpenPath = "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z";
          const eyeClosedPath = "M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.01-.16c0-1.66-1.34-3-3-3l-.16.01z";

          function togglePassword() {

            const password =
              document.getElementById(
                'password'
              );

            const button =
              document.getElementById(
                'passwordButton'
              );

            if (
              password.type === 'password'
            ) {

              password.type =
                'text';

              // button.innerText ='HIDE';
              document.querySelector('#eyeIcon path').setAttribute('d', eyeOpenPath);
            }

            else {

              password.type =
                'password';

              // button.innerText = 'SHOW';
              document.querySelector('#eyeIcon path').setAttribute('d', eyeClosedPath);
            }

          }

async function scanNetworks(){

  try{

    let r =
      await fetch(
        "/wifi/scan"
      );

    let networks =
      await r.json();

    let select =
      document.getElementById(
        "ssid"
      );


    networks.forEach(
      function(network){

        let option =
          document.createElement(
            "option"
          );

        option.value =
          network.ssid;

        option.text =
          network.ssid +
          " (" +
          network.rssi +
          " dBm)";

        select.appendChild(
          option
        );

      }
    );


    select.addEventListener(
      "change",
      function(){

        document.getElementById(
          "manualssid"
        ).value =
          this.value;

      }
    );


  }catch(e){

    console.log(e);

  }

}


scanNetworks();

</script>

</body>

</html>
